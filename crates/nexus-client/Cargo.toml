[package]
name = "nexus-client"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Per DD-008 §1: nexusctl talks to nexusd only over D-Bus and must be
# packageable independently of the backend crates. Nothing in this
# manifest depends on `nexus-*` workspace crates.

[features]
default = []
# Opt-in for integration tests that drive `MockPrompt` and the
# `MockEventSource` from outside the crate. Production builds leave
# the mocks out of the link.
interactive-flows-testing = []

[[bin]]
name = "nexusctl"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anstream = "0.6"
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
comfy-table = "7"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
globset = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zbus = { workspace = true }

[dev-dependencies]
clap_mangen = "0.2"
insta = "1"
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
