# Minimal nexus.toml suitable for running nexusd on a real Linux
# machine under `cargo run -p nexus-daemon -- --config
# tests/fixtures/minimal.toml`.
#
# - Uses an in-memory profile-store key so the daemon does not
#   require `/var/lib/nexus` on disk.
# - Publishes `fi.nexus1` on the session bus to avoid the
#   system-bus policy file requirement during development.
# - Disables Wi-Fi / Bluetooth / GNSS because those require
#   wpa_supplicant, BlueZ, and gpsd to be running respectively;
#   enable them once the supporting daemons are available.
# - Turns off PolicyKit (allow_all_authz = true) so the development
#   workflow doesn't need an installed `fi.nexus.policy` action
#   file.

bus_capacity = 128
log_level = "info"

[supervision]
restart = true
restart_initial_backoff = 0.5
restart_max_backoff = 30.0
restart_multiplier = 2.0

[interface_monitor]
enabled = true

[profile_store]
root = "/tmp/nexus-dev"
key_source = "in_memory"
# 32 bytes of 0x11 — development only; production uses `file` or
# `tpm` key sources.
in_memory_seed = "1111111111111111111111111111111111111111111111111111111111111111"

[dbus]
enabled = true
bus_name = "fi.nexus1"
use_session_bus = true
allow_all_authz = true
rate_limit_scan_per_min = 10
rate_limit_connect_per_min = 30
rate_limit_profile_write_per_min = 30
rate_limit_admin_per_min = 1
rate_limit_property_read_per_min = 1000

[ethernet]
enabled = true
auth_backend = "none"
retry_initial = 0.5
retry_max = 30.0
retry_multiplier = 2.0
retry_max_attempts = 8

[wifi]
enabled = false
backend = "mock"
roam_mode = "supplicant"
signal_poll_interval = 5.0
disconnect_cool_down = 2.0
supplicant_event_capacity = 128

[bluetooth]
enabled = false
mock = false

[gnss]
enabled = false
mock = false
