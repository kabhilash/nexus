[package]
name = "nexus-daemon"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nexusd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
libc = { workspace = true }
sd-notify = "0.4"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ulid = { workspace = true }
zbus = { workspace = true }

nexus-core = { path = "../nexus-core" }
nexus-interface-monitor = { path = "../nexus-interface-monitor" }
nexus-ethernet = { path = "../nexus-ethernet" }
nexus-wifi = { path = "../nexus-wifi" }
nexus-bluetooth = { path = "../nexus-bluetooth" }
nexus-gnss = { path = "../nexus-gnss" }
nexus-dbus = { path = "../nexus-dbus" }
nexus-profile-store = { path = "../nexus-profile-store" }

[dev-dependencies]
tempfile = "3"
