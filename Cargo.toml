[workspace]
resolver = "3"
members = [
    "crates/nexus-core",
    "crates/nexus-interface-monitor",
    "crates/nexus-ethernet",
    "crates/nexus-wifi",
    "crates/nexus-bluetooth",
    "crates/nexus-gnss",
    "crates/nexus-dbus",
    "crates/nexus-profile-store",
    "crates/nexus-auth-eap",
    "crates/nexus-daemon",
]

[workspace.package]
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hkdf = "0.12"
libc = "0.2"
metrics = "0.24"
scrypt = "0.11"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
udev = "0.9"
ulid = { version = "1", features = ["serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
