[workspace]
resolver = "3"
members = [
    "crates/nexus-core",
    "crates/nexus-interface-monitor",
    "crates/nexus-ethernet",
    "crates/nexus-wifi",
    "crates/nexus-bluetooth",
]

[workspace.package]
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ulid = { version = "1", features = ["serde"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
