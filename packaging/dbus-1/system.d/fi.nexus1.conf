<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  Nexus system bus policy.

  Without this file, dbus-broker / dbus-daemon rejects nexusd's
  attempt to own `fi.nexus1` with:

    org.freedesktop.DBus.Error.AccessDenied: Connection ":1.N" is
    not allowed to own the service "fi.nexus1" due to security
    policies in the configuration file

  The unit file (packaging/nexus.service) runs nexusd as User=nexus,
  so we grant that user alone the right to own the name. Root can
  also own it for rescue / manual-debug sessions. Everything else
  (method calls, property reads, signal receipt) is open to all
  clients — PolicyKit guards the privileged methods at the nexusd
  level via packaging/polkit-1/.

  Installed by packaging/nexus-install.sh into
  /etc/dbus-1/system.d/ (dropped into that tree rather than
  /usr/share/dbus-1/system.d/ so distro updates can't clobber it).
-->
<busconfig>
  <!-- Only the nexus system user may own the well-known name. -->
  <policy user="nexus">
    <allow own="fi.nexus1"/>
    <allow send_destination="fi.nexus1"/>
  </policy>

  <!-- Root can own it too — useful for testing nexusd by hand
       (`sudo nexusd`) without recreating the system account. -->
  <policy user="root">
    <allow own="fi.nexus1"/>
    <allow send_destination="fi.nexus1"/>
  </policy>

  <!-- Any client may talk to the service. Authorisation for
       privileged methods is enforced by the nexusd process itself
       via PolicyKit (see packaging/polkit-1/). -->
  <policy context="default">
    <allow send_destination="fi.nexus1"/>
    <allow receive_sender="fi.nexus1"/>
  </policy>
</busconfig>
