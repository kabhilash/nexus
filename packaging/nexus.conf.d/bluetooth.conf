# Bluetooth subsystem — DD-004. Paste this block into /etc/nexus/nexus.toml.
#
# Requires BlueZ (`bluetoothd`) to be running on the system bus.
# The `nexus.service` unit already soft-depends on
# `bluetooth.service`.

[bluetooth]
enabled = true
# Real BlueZ client — set `true` only when running the Nexus mock
# backend for tests or driver bring-up.
mock = false
# How long to wait for a pairing exchange to complete before
# declaring it failed.
pairing_timeout_s = 60
# Timeout for a single Agent callback (BlueZ → nexus → operator UI).
agent_response_timeout_s = 45
# Default discovery window; SetDiscoveryFilter on the D-Bus API
# overrides this per-call.
discovery_timeout_s = 30
# Age at which a device heard-of during discovery but not since is
# considered stale and expunged.
discovery_device_ttl_s = 300
# If BlueZ stays unreachable for this many seconds, emit an
# operator notification rather than silently retrying forever.
bluez_outage_notify_s = 60
# Power the adapter on at startup. Disable on battery devices that
# should stay radio-off until the operator explicitly enables them.
auto_power_on_startup = true
# Register Nexus as BlueZ's Agent (handles pairing prompts).
# Disable if `bluetoothctl` or another UI owns the Agent role.
register_agent = true
