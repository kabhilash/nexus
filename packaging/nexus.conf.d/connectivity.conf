# Internet-connectivity probe. Paste this block into
# /etc/nexus/nexus.toml.
#
# A small task issues HTTP/1.1 GETs against the configured URL and
# emits `fi.nexus.Manager.ConnectivityChanged(state: s)` (and updates
# the `fi.nexus.Manager.Connectivity` property) on transitions
# between `internetOnline`, `internetCaptivePortal`, and
# `internetOffline`. The probe URL must be plain `http://` — see
# `crates/nexus-daemon/src/connectivity.rs` for why.

[connectivity]
enabled = true
# Default mirrors NetworkManager / Ubuntu's connectivity-check;
# `http://www.gstatic.com/generate_204` is a working alternative.
url = "http://connectivity-check.ubuntu.com/"
# Periodic probe cadence in seconds. Each link-up event also
# triggers an immediate probe regardless of this interval.
interval = 30.0
# Total probe budget (DNS + connect + write + first read).
timeout = 5.0
