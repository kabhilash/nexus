# Internet-connectivity probe. Paste this block into
# /etc/nexus/nexus.toml.
#
# A small event-driven task issues HTTP/1.1 GETs against the
# configured URL on every Wi-Fi / Ethernet link-ready event, and on
# nexusd startup. It emits
# `fi.nexus.Manager.InternetConnectivityChanged(state: s)` (and updates
# the `fi.nexus.Manager.InternetConnectivity` property) on transitions
# between `internetOnline`, `internetCaptivePortal`, and
# `internetOffline`. There is no periodic backstop — when the last
# link drops, the state is pinned at `internetOffline` until something
# else comes up. The probe URL must be plain `http://` — see
# `crates/nexus-daemon/src/connectivity.rs` for why.

[connectivity]
enabled = true
# Default mirrors NetworkManager / Ubuntu's connectivity-check;
# `http://www.gstatic.com/generate_204` is a working alternative.
url = "http://connectivity-check.ubuntu.com/"
# Total probe budget (DNS + connect + write + first read).
timeout = 5.0
