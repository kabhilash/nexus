# GNSS subsystem — DD-005. Paste this block into /etc/nexus/nexus.toml.
#
# Requires gpsd listening on the TCP endpoint below. On Ubuntu
# 24.04 this typically means installing the `gpsd` package and
# starting `gpsd.socket`.

[gnss]
enabled = true
# Real gpsd JSON client. Set `true` to wire the in-process mock
# for tests / dev setups without a GNSS receiver.
mock = false
# gpsd TCP endpoint. `gpsd.socket` listens here by default.
gpsd_endpoint = "127.0.0.1:2947"
# Time allowed in the Acquiring state before the backend moves
# the device to Degraded (DD-005 §6.3).
acquisition_timeout_s = 300
# TPV silence threshold: after this many seconds without a TPV
# the device transitions Tracking → Degraded.
tpv_stall_timeout_s = 30
# Emit `OperatorNotification` if gpsd stays unreachable for this
# many seconds. The backend keeps retrying regardless.
gpsd_outage_notify_s = 60
