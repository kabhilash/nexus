# Wi-Fi subsystem — DD-003. Paste this block into /etc/nexus/nexus.toml.
#
# Requires wpa_supplicant to be installed and reachable on the
# system bus. The `nexus.service` unit already declares a soft
# dependency on `wpa_supplicant.service`.

[wifi]
enabled = true
# "wpa_supplicant" (default), "iwd" (alt; integrator must validate
# against their Wi-Fi module — see ADR-002), or "mock" (test only).
backend = "wpa_supplicant"
# "off" disables roaming entirely.
# "supplicant" lets wpa_supplicant drive roams.
# "nexus" moves the policy into Nexus (DD-003 §7).
roam_mode = "supplicant"
# Signal-strength poll cadence while associated. Longer = less
# overhead, weaker "signal drop" detection.
signal_poll_interval = 5.0
# Cool-down window after a disconnect before the state machine
# is willing to try the same BSS again.
disconnect_cool_down = 2.0
# Supplicant-event channel capacity. Bump up only if you see
# "supplicant event receiver lagged" warnings in the journal.
supplicant_event_capacity = 128
