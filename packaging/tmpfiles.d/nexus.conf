# Nexus runtime state lives under /var/lib/nexus. systemd-tmpfiles
# creates the tree with the right ownership on first boot and on
# every reboot, so the daemon's `User=nexus` service can write to
# it without elevated privilege.
#
# See DD-007 §4 for the on-disk layout.

# Top-level state dir — group-readable so operator tooling running
# as `nexus-admin` group can list profiles.
d /var/lib/nexus      0750 nexus nexus -

# Master-key directory. `FileKeySource` writes the key here with
# mode 0400; it must be owner-only readable.
d /var/lib/nexus/keys 0700 nexus nexus -

# Profile subdirectories — DD-007 §4.1. Created lazily by the store
# on first write, but pre-creating them avoids a spurious mkdir on
# every boot.
d /var/lib/nexus/ethernet  0750 nexus nexus -
d /var/lib/nexus/wifi      0750 nexus nexus -
d /var/lib/nexus/bluetooth 0750 nexus nexus -
d /var/lib/nexus/gnss      0750 nexus nexus -

# Quarantine directory for corrupt / unreadable profiles.
d /var/lib/nexus/quarantine 0750 nexus nexus -
